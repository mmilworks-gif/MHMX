<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>My House Mx</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <img id="logo" src="logo.png" alt=""><b>My House Mx</b>
  <input id="ip" placeholder="IP da mesa (ex: 192.168.0.50)">
  <button id="btnConn">Conectar</button>
  <button id="btnFind" title="Procura a mesa na rede">Procurar mesa</button>
  <select id="found" hidden></select>
  <button id="btnDemo" title="Mesa simulada para testar sem a mesa real">Modo demo</button>
  <span id="conn" class="c-off" title="Desconectado">●</span><span id="status">Desconectado</span>
  <span class="sp"></span>
  <span id="ver"></span>
  <button id="btnUpd">Verificar atualização</button>
  <button id="btnInst" hidden>Reiniciar e atualizar</button>
</header>
<div id="connbar" hidden>Sem conexão com a mesa. Tentando reconectar automaticamente...</div>
<div id="app">
  <aside id="side"><div id="selbox">Ch 01</div><div class="sl">Bank</div><div id="banks"></div><button id="btnEditBanks" class="sb" title="Escolher os canais dos bancos User 1/2/3">✎ Editar bancos</button><button id="btnPin" class="sb">📌 Fixar</button></aside>
  <section id="center">
    <nav id="tabs"></nav>
    <div id="content"><main id="strips"></main><div id="page" hidden></div></div>
  </section>
  <aside id="right"><div id="rctl"></div><div id="pinstrip"></div><div id="mainstrip"></div></aside>
</div>
<div id="detail" hidden></div>
<script src="app.js"></script>
</body></html>
